<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">LABUST underwater domain-transfer result</title>
  <desc id="desc">A comparison of target validation mAP50-95 for source-best transfer, transfer-selected initialization, and the accepted eight-frame adaptation, with source-retention and decision-gate context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03101d"/>
      <stop offset="0.55" stop-color="#071b2b"/>
      <stop offset="1" stop-color="#0a2935"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#3be8ff" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="24" fill="url(#bg)" stroke="#16829a" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="556" rx="23" fill="url(#grid)"/>

  <g opacity="0.19" fill="none" stroke="#3be8ff">
    <circle cx="1060" cy="110" r="42"/>
    <circle cx="1060" cy="110" r="76"/>
    <circle cx="1060" cy="110" r="110"/>
    <path d="M935 110h250M1060-15v250M1060 110l102-58"/>
  </g>
  <circle cx="1135" cy="68" r="5" fill="#3be8ff" filter="url(#glow)"/>
  <circle cx="995" cy="154" r="4" fill="#27c7a8" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="62" y="68" fill="#27c7a8" font-size="15" font-weight="700" letter-spacing="5">FIELD RESULT / 2026</text>
    <text x="62" y="112" fill="#f2f8fb" font-size="30" font-weight="800">UNDERWATER DOMAIN TRANSFER</text>
    <text x="62" y="142" fill="#9bdff2" font-size="15" letter-spacing="1.5">TARGET VALIDATION mAP50-95 · HIGHER IS BETTER</text>

    <g font-size="15">
      <text x="62" y="215" fill="#9bb5c1">SOURCE-BEST TRANSFER</text>
      <text x="62" y="278" fill="#9bb5c1">TRANSFER-SELECTED INIT</text>
      <text x="62" y="341" fill="#f2f8fb" font-weight="700">ACCEPTED ADAPTATION</text>
    </g>

    <g>
      <rect x="300" y="195" width="700" height="26" rx="13" fill="#0b3041"/>
      <rect x="300" y="258" width="700" height="26" rx="13" fill="#0b3041"/>
      <rect x="300" y="321" width="700" height="26" rx="13" fill="#0b3041"/>
      <rect x="300" y="195" width="43" height="26" rx="13" fill="#52758a"/>
      <rect x="300" y="258" width="255" height="26" rx="13" fill="#16829a"/>
      <rect x="300" y="321" width="700" height="26" rx="13" fill="#27c7a8"/>
    </g>

    <g font-size="18" font-weight="800" text-anchor="end">
      <text x="1088" y="215" fill="#9bb5c1">0.0076</text>
      <text x="1088" y="278" fill="#9bdff2">0.0454</text>
      <text x="1088" y="341" fill="#3be8ff">0.1244</text>
    </g>

    <line x1="62" y1="387" x2="1138" y2="387" stroke="#16829a" stroke-opacity="0.65"/>

    <g>
      <rect x="62" y="418" width="326" height="92" rx="13" fill="#071723" stroke="#16829a"/>
      <text x="84" y="448" fill="#9bdff2" font-size="12" letter-spacing="2">TARGET GAIN</text>
      <text x="84" y="485" fill="#f2f8fb" font-size="25" font-weight="800">2.74×</text>
      <text x="180" y="485" fill="#7fa6b7" font-size="12">vs selected init</text>

      <rect x="410" y="418" width="326" height="92" rx="13" fill="#071723" stroke="#16829a"/>
      <text x="432" y="448" fill="#9bdff2" font-size="12" letter-spacing="2">SOURCE RETENTION</text>
      <text x="432" y="485" fill="#f2f8fb" font-size="25" font-weight="800">95.45%</text>
      <text x="550" y="485" fill="#7fa6b7" font-size="12">0.5556 mAP50-95</text>

      <rect x="758" y="418" width="380" height="92" rx="13" fill="#071723" stroke="#27c7a8"/>
      <text x="780" y="448" fill="#27c7a8" font-size="12" letter-spacing="2">DECISION GATE</text>
      <text x="780" y="478" fill="#f2f8fb" font-size="15" font-weight="700">8 FRAMES + REPLAY + FREEZE + BLEND</text>
      <text x="780" y="499" fill="#7fa6b7" font-size="11">raw 0.16048 branch rejected: plastic gate failed</text>
    </g>
  </g>
</svg>
