<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Hamza Raheel profile banner</title>
  <desc id="desc">A dark underwater sonar interface introducing Hamza Raheel and his focus on software systems, applied AI, and computer vision.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.52" stop-color="#061827"/>
      <stop offset="1" stop-color="#063545"/>
    </linearGradient>
    <radialGradient id="sonarGlow" cx="76%" cy="49%" r="43%">
      <stop offset="0" stop-color="#3BE8FF" stop-opacity=".19"/>
      <stop offset=".48" stop-color="#27C7A8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BE8FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#3BE8FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7BDCEC" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rightHalf">
      <rect x="660" y="0" width="620" height="420"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="22" fill="url(#sonarGlow)"/>

  <g opacity=".25" stroke="#3BE8FF" fill="none" clip-path="url(#rightHalf)">
    <circle cx="980" cy="210" r="55"/>
    <circle cx="980" cy="210" r="110"/>
    <circle cx="980" cy="210" r="165"/>
    <circle cx="980" cy="210" r="220"/>
    <path d="M720 210H1240M980-50V470"/>
    <path d="M796 26L1164 394M1164 26L796 394"/>
  </g>

  <path d="M980 210L1225 112A265 265 0 0 1 1245 210Z" fill="url(#sweep)" opacity=".8"/>
  <path d="M980 210L1240 210" stroke="#3BE8FF" stroke-width="2" stroke-opacity=".8"/>

  <g fill="#3BE8FF" filter="url(#glow)">
    <circle cx="1118" cy="132" r="4"/>
    <circle cx="1071" cy="284" r="3"/>
    <circle cx="1183" cy="247" r="5"/>
    <circle cx="891" cy="104" r="3"/>
    <circle cx="826" cy="314" r="4"/>
  </g>

  <g fill="#27C7A8" opacity=".75">
    <circle cx="742" cy="82" r="2"/>
    <circle cx="782" cy="158" r="2"/>
    <circle cx="1218" cy="74" r="2"/>
    <circle cx="1167" cy="340" r="2"/>
    <circle cx="929" cy="357" r="2"/>
  </g>

  <path d="M0 333C95 301 170 349 267 326S446 286 555 319 716 367 814 334 990 293 1095 324 1198 350 1280 316V420H0Z" fill="#02111A" opacity=".84"/>
  <path d="M0 353C97 331 180 369 278 349S449 322 555 346 723 382 825 356 995 326 1097 347 1206 369 1280 340" fill="none" stroke="#27C7A8" stroke-opacity=".18" stroke-width="2"/>

  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">
    <text x="72" y="84" fill="#27C7A8" font-size="16" font-weight="700" letter-spacing="4">PROFILE / 2026</text>
    <text x="72" y="183" fill="#F4FCFF" font-size="68" font-weight="800" letter-spacing="2">HAMZA RAHEEL</text>
    <text x="76" y="229" fill="#9BDFF2" font-size="17" letter-spacing="2.5">SOFTWARE SYSTEMS · APPLIED AI · COMPUTER VISION</text>

    <rect x="74" y="272" width="154" height="34" rx="17" fill="#08293A" stroke="#27C7A8" stroke-opacity=".5"/>
    <text x="96" y="294" fill="#A9F3DF" font-size="13" font-weight="700" letter-spacing="1.4">FAST-NUCES</text>

    <rect x="242" y="272" width="194" height="34" rx="17" fill="#08293A" stroke="#3BE8FF" stroke-opacity=".5"/>
    <text x="264" y="294" fill="#A8EDFF" font-size="13" font-weight="700" letter-spacing="1.4">RESEARCH MODE</text>

    <rect x="450" y="272" width="180" height="34" rx="17" fill="#08293A" stroke="#7BDCEC" stroke-opacity=".5"/>
    <text x="472" y="294" fill="#D1F8FF" font-size="13" font-weight="700" letter-spacing="1.4">LAHORE, PK</text>

    <text x="72" y="379" fill="#5D9AA9" font-size="13" letter-spacing="2">BUILD → MEASURE → LEARN → SHIP</text>
    <text x="1057" y="379" fill="#5D9AA9" font-size="12" letter-spacing="2">SONAR ONLINE</text>
    <circle cx="1038" cy="375" r="4" fill="#27C7A8" filter="url(#glow)"/>
  </g>

  <rect x=".75" y=".75" width="1278.5" height="418.5" rx="21.25" fill="none" stroke="#3BE8FF" stroke-opacity=".2" stroke-width="1.5"/>
</svg>
