<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">UNAM LLM-unlearning evaluation foundations</title>
  <desc id="desc">A research map covering a 1,733-document audit, lexical through neural proximity measurements, controlled construct validation, and the decision gate that holds experiments until definitions are agreed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03101d"/>
      <stop offset="0.55" stop-color="#071b2b"/>
      <stop offset="1" stop-color="#0a2935"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3be8ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#3be8ff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="688" rx="24" fill="url(#bg)" stroke="#16829a" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="686" rx="23" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="54" y="55" fill="#27c7a8" font-size="14" font-weight="700" letter-spacing="5">UNAM RESEARCH / EVALUATION FOUNDATIONS</text>
    <text x="54" y="98" fill="#f2f8fb" font-size="29" font-weight="800">WHAT DOES “NEARBY” MEAN AFTER UNLEARNING?</text>
    <text x="54" y="128" fill="#9bdff2" font-size="14" letter-spacing="1.2">PROXIMITY · COLLATERAL EFFECTS · REPRODUCIBLE MEASUREMENT</text>

    <g opacity="0.22" fill="none" stroke="#8b7cff">
      <circle cx="1070" cy="85" r="26"/><circle cx="1070" cy="85" r="51"/><circle cx="1070" cy="85" r="76"/>
      <path d="M980 85h180M1070-5v180M1070 85l67-40"/>
    </g>
    <circle cx="1125" cy="52" r="5" fill="#8b7cff" filter="url(#glow)"/>

    <path d="M178 263H1018" stroke="url(#flow)" stroke-width="3" stroke-opacity="0.65"/>
    <path d="M1008 255l14 8-14 8" fill="none" stroke="#8b7cff" stroke-width="3"/>

    <g>
      <rect x="54" y="171" width="250" height="190" rx="15" fill="#061723" stroke="#16829a"/>
      <circle cx="179" cy="263" r="25" fill="#0b3041" stroke="#3be8ff" stroke-width="2"/>
      <text x="179" y="269" fill="#3be8ff" font-size="18" font-weight="800" text-anchor="middle">01</text>
      <text x="76" y="207" fill="#27c7a8" font-size="11" font-weight="700" letter-spacing="2.5">CORPUS AUDIT</text>
      <text x="76" y="324" fill="#f2f8fb" font-size="22" font-weight="800">1,733 documents</text>
      <text x="76" y="346" fill="#7fa6b7" font-size="11">split, artifact, and provenance checks</text>

      <rect x="334" y="171" width="250" height="190" rx="15" fill="#061723" stroke="#16829a"/>
      <circle cx="459" cy="263" r="25" fill="#0b3041" stroke="#3be8ff" stroke-width="2"/>
      <text x="459" y="269" fill="#3be8ff" font-size="18" font-weight="800" text-anchor="middle">02</text>
      <text x="356" y="207" fill="#27c7a8" font-size="11" font-weight="700" letter-spacing="2.5">GEOMETRY</text>
      <text x="356" y="319" fill="#f2f8fb" font-size="15" font-weight="800">JACCARD → N-GRAMS</text>
      <text x="356" y="341" fill="#f2f8fb" font-size="15" font-weight="800">LSA → MINILM</text>

      <rect x="614" y="171" width="250" height="190" rx="15" fill="#061723" stroke="#5d64c9"/>
      <circle cx="739" cy="263" r="25" fill="#262450" stroke="#8b7cff" stroke-width="2"/>
      <text x="739" y="269" fill="#b9b0ff" font-size="18" font-weight="800" text-anchor="middle">03</text>
      <text x="636" y="207" fill="#b9b0ff" font-size="11" font-weight="700" letter-spacing="2.5">CONSTRUCT SCREEN</text>
      <text x="636" y="319" fill="#f2f8fb" font-size="19" font-weight="800">6 cases · 8 methods</text>
      <text x="636" y="343" fill="#8f9fac" font-size="12">9 preregistered hypotheses</text>

      <rect x="894" y="171" width="252" height="190" rx="15" fill="#071723" stroke="#27c7a8" stroke-width="2"/>
      <circle cx="1019" cy="263" r="25" fill="#0d433e" stroke="#27c7a8" stroke-width="2"/>
      <path d="M1009 263l7 7 14-17" fill="none" stroke="#83f4de" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="916" y="207" fill="#27c7a8" font-size="11" font-weight="700" letter-spacing="2.5">DECISION GATE</text>
      <text x="916" y="315" fill="#f2f8fb" font-size="17" font-weight="800">DEFINE BEFORE RUNNING</text>
      <text x="916" y="340" fill="#83f4de" font-size="11">experiment selection intentionally held</text>
    </g>

    <line x1="54" y1="394" x2="1146" y2="394" stroke="#16829a" stroke-opacity="0.7"/>

    <text x="54" y="432" fill="#9bdff2" font-size="11" font-weight="700" letter-spacing="2.6">DENSE METHODS ARE NOT INTERCHANGEABLE · LSA ↔ MINILM NEAREST-SCORE SPEARMAN ρ</text>
    <g>
      <rect x="54" y="458" width="320" height="78" rx="12" fill="#071723" stroke="#16829a"/>
      <text x="77" y="484" fill="#7fa6b7" font-size="11">TASK 1</text>
      <rect x="77" y="500" width="238" height="12" rx="6" fill="#0b3041"/>
      <rect x="77" y="500" width="44" height="12" rx="6" fill="#3be8ff"/>
      <text x="340" y="512" fill="#f2f8fb" font-size="20" font-weight="800" text-anchor="end">0.186</text>

      <rect x="394" y="458" width="320" height="78" rx="12" fill="#071723" stroke="#16829a"/>
      <text x="417" y="484" fill="#7fa6b7" font-size="11">TASK 2</text>
      <rect x="417" y="500" width="238" height="12" rx="6" fill="#0b3041"/>
      <rect x="417" y="500" width="28" height="12" rx="6" fill="#3be8ff"/>
      <text x="680" y="512" fill="#f2f8fb" font-size="20" font-weight="800" text-anchor="end">0.117</text>

      <rect x="734" y="458" width="412" height="78" rx="12" fill="#071723" stroke="#5d64c9"/>
      <text x="757" y="484" fill="#7fa6b7" font-size="11">TASK 3</text>
      <rect x="757" y="500" width="292" height="12" rx="6" fill="#151c3d"/>
      <rect x="757" y="500" width="125" height="12" rx="6" fill="#8b7cff"/>
      <text x="1113" y="512" fill="#f2f8fb" font-size="20" font-weight="800" text-anchor="end">0.427</text>
    </g>

    <g>
      <rect x="54" y="568" width="528" height="74" rx="13" fill="#061723" stroke="#27c7a8"/>
      <text x="78" y="594" fill="#27c7a8" font-size="10" font-weight="700" letter-spacing="2">MEASUREMENT VERIFICATION</text>
      <text x="78" y="626" fill="#f2f8fb" font-size="25" font-weight="800">10,818 independent checks</text>

      <rect x="618" y="568" width="528" height="74" rx="13" fill="#061723" stroke="#8b7cff"/>
      <text x="642" y="594" fill="#b9b0ff" font-size="10" font-weight="700" letter-spacing="2">CONSTRUCT VERIFICATION</text>
      <text x="642" y="626" fill="#f2f8fb" font-size="25" font-weight="800">630 independent checks</text>
    </g>

    <text x="54" y="672" fill="#6f93a3" font-size="10" letter-spacing="1.25">PUBLIC-SAFE STATUS · AUDIT COMPLETE · DEFINITIONS UNDER REVIEW · NO UNLEARNING EXPERIMENT SELECTED</text>
  </g>
</svg>
