<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">UNAM LLM-unlearning evaluation foundations</title>
  <desc id="desc">A research map covering a 1,733-document audit, lexical through neural proximity measurements, controlled construct validation, and the decision gate that holds experiments until definitions are agreed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03101d"/>
      <stop offset="0.55" stop-color="#071b2b"/>
      <stop offset="1" stop-color="#0a2935"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3be8ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#3be8ff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="778" rx="24" fill="url(#bg)" stroke="#16829a" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="776" rx="23" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="54" y="54" fill="#27c7a8" font-size="14" font-weight="700" letter-spacing="4.5">UNAM RESEARCH / EVALUATION</text>
    <text x="54" y="96" fill="#f2f8fb" font-size="29" font-weight="800">WHAT DOES “NEARBY” MEAN AFTER UNLEARNING?</text>
    <text x="54" y="126" fill="#9bdff2" font-size="14" letter-spacing="1.2">PROXIMITY · COLLATERAL EFFECTS · REPRODUCIBLE MEASUREMENT</text>

    <g opacity="0.22" fill="none" stroke="#8b7cff">
      <circle cx="1084" cy="76" r="22"/><circle cx="1084" cy="76" r="43"/><circle cx="1084" cy="76" r="64"/>
      <path d="M1008 76h152M1084 0v152M1084 76l58-35"/>
    </g>
    <circle cx="1125" cy="51" r="5" fill="#8b7cff" filter="url(#glow)"/>

    <path d="M106 238H1094" stroke="url(#flow)" stroke-width="3" stroke-opacity="0.55"/>
    <path d="M1084 230l14 8-14 8" fill="none" stroke="#8b7cff" stroke-width="3"/>

    <g>
      <rect x="54" y="158" width="532" height="154" rx="15" fill="#061723" stroke="#16829a"/>
      <circle cx="98" cy="204" r="23" fill="#0b3041" stroke="#3be8ff" stroke-width="2"/>
      <text x="98" y="210" fill="#3be8ff" font-size="17" font-weight="800" text-anchor="middle">01</text>
      <text x="140" y="191" fill="#27c7a8" font-size="11" font-weight="700" letter-spacing="2.4">CORPUS AUDIT</text>
      <text x="140" y="225" fill="#f2f8fb" font-size="24" font-weight="800">1,733 documents</text>
      <text x="78" y="275" fill="#7fa6b7" font-size="13">split integrity · artifact checks · provenance review</text>

      <rect x="614" y="158" width="532" height="154" rx="15" fill="#061723" stroke="#16829a"/>
      <circle cx="658" cy="204" r="23" fill="#0b3041" stroke="#3be8ff" stroke-width="2"/>
      <text x="658" y="210" fill="#3be8ff" font-size="17" font-weight="800" text-anchor="middle">02</text>
      <text x="700" y="191" fill="#27c7a8" font-size="11" font-weight="700" letter-spacing="2.4">MEASUREMENT MAP</text>
      <text x="700" y="225" fill="#f2f8fb" font-size="20" font-weight="800">LEXICAL → SPARSE → DENSE → NEURAL</text>
      <text x="638" y="275" fill="#7fa6b7" font-size="13">Jaccard · n-gram TF-IDF · LSA · pinned MiniLM</text>

      <rect x="54" y="336" width="532" height="154" rx="15" fill="#061723" stroke="#5d64c9"/>
      <circle cx="98" cy="382" r="23" fill="#262450" stroke="#8b7cff" stroke-width="2"/>
      <text x="98" y="388" fill="#b9b0ff" font-size="17" font-weight="800" text-anchor="middle">03</text>
      <text x="140" y="369" fill="#b9b0ff" font-size="11" font-weight="700" letter-spacing="2.4">CONTROLLED CONSTRUCT SCREEN</text>
      <text x="140" y="403" fill="#f2f8fb" font-size="22" font-weight="800">6 cases · 8 methods</text>
      <text x="78" y="453" fill="#8f9fac" font-size="13">4 typed controls · 9 preregistered hypotheses</text>

      <rect x="614" y="336" width="532" height="154" rx="15" fill="#071723" stroke="#27c7a8" stroke-width="2"/>
      <circle cx="658" cy="382" r="23" fill="#0d433e" stroke="#27c7a8" stroke-width="2"/>
      <path d="M649 382l6 6 13-16" fill="none" stroke="#83f4de" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="700" y="369" fill="#27c7a8" font-size="11" font-weight="700" letter-spacing="2.4">DECISION GATE</text>
      <text x="700" y="403" fill="#f2f8fb" font-size="21" font-weight="800">DEFINE BEFORE RUNNING</text>
      <text x="638" y="453" fill="#83f4de" font-size="13">experiment selection remains intentionally held</text>
    </g>

    <line x1="54" y1="519" x2="1146" y2="519" stroke="#16829a" stroke-opacity="0.7"/>
    <text x="54" y="552" fill="#9bdff2" font-size="11" font-weight="700" letter-spacing="2.2">LSA ↔ MINILM NEAREST-SCORE SPEARMAN ρ · DENSE METHODS ARE NOT INTERCHANGEABLE</text>

    <g>
      <rect x="54" y="572" width="344" height="72" rx="12" fill="#071723" stroke="#16829a"/>
      <text x="76" y="598" fill="#7fa6b7" font-size="11">TASK 1</text>
      <rect x="76" y="614" width="238" height="11" rx="5.5" fill="#0b3041"/>
      <rect x="76" y="614" width="44" height="11" rx="5.5" fill="#3be8ff"/>
      <text x="372" y="626" fill="#f2f8fb" font-size="19" font-weight="800" text-anchor="end">0.186</text>

      <rect x="428" y="572" width="344" height="72" rx="12" fill="#071723" stroke="#16829a"/>
      <text x="450" y="598" fill="#7fa6b7" font-size="11">TASK 2</text>
      <rect x="450" y="614" width="238" height="11" rx="5.5" fill="#0b3041"/>
      <rect x="450" y="614" width="28" height="11" rx="5.5" fill="#3be8ff"/>
      <text x="746" y="626" fill="#f2f8fb" font-size="19" font-weight="800" text-anchor="end">0.117</text>

      <rect x="802" y="572" width="344" height="72" rx="12" fill="#071723" stroke="#5d64c9"/>
      <text x="824" y="598" fill="#7fa6b7" font-size="11">TASK 3</text>
      <rect x="824" y="614" width="238" height="11" rx="5.5" fill="#151c3d"/>
      <rect x="824" y="614" width="102" height="11" rx="5.5" fill="#8b7cff"/>
      <text x="1120" y="626" fill="#f2f8fb" font-size="19" font-weight="800" text-anchor="end">0.427</text>
    </g>

    <g>
      <rect x="54" y="670" width="532" height="70" rx="13" fill="#061723" stroke="#27c7a8"/>
      <text x="78" y="695" fill="#27c7a8" font-size="10" font-weight="700" letter-spacing="2">MEASUREMENT VERIFICATION</text>
      <text x="78" y="725" fill="#f2f8fb" font-size="23" font-weight="800">10,818 independent checks</text>

      <rect x="614" y="670" width="532" height="70" rx="13" fill="#061723" stroke="#8b7cff"/>
      <text x="638" y="695" fill="#b9b0ff" font-size="10" font-weight="700" letter-spacing="2">CONSTRUCT VERIFICATION</text>
      <text x="638" y="725" fill="#f2f8fb" font-size="23" font-weight="800">630 independent checks</text>
    </g>

    <text x="1146" y="763" fill="#6f93a3" font-size="9" letter-spacing="1.05" text-anchor="end">PUBLIC-SAFE · AUDIT COMPLETE · DEFINITIONS UNDER REVIEW · NO UNLEARNING EXPERIMENT SELECTED</text>
  </g>
</svg>
